<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Memorial Park — FPS Controls</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020208;
            font-family: monospace;
            position: fixed;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }
        #canvas-container:active {
            cursor: grabbing;
        }

        .ui-hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00f3ff;
            font-size: 10px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
            opacity: 0.7;
            line-height: 1.8;
            z-index: 10;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }
        .ui-hud .highlight {
            color: #ffdd88;
        }
        .ui-hud .sky {
            color: #88ddff;
        }
        .ui-hud .key {
            color: #ff8844;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 14px;
            border-radius: 40px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.08);
            flex-wrap: wrap;
            justify-content: center;
        }
        #controls button {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            padding: 4px 10px;
            border-radius: 18px;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        #controls button:hover {
            background: rgba(0, 243, 255, 0.15);
            border-color: #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }
        #controls button.active {
            background: rgba(0, 243, 255, 0.2);
            border-color: #00f3ff;
        }
        #controls button.gold {
            border-color: rgba(255, 200, 100, 0.2);
            color: #ffdd88;
        }
        #controls button.gold:hover {
            background: rgba(255, 200, 100, 0.1);
            border-color: #ffdd88;
        }
        #controls button.gold.active {
            background: rgba(255, 200, 100, 0.15);
            border-color: #ffdd88;
        }

        #status {
            position: absolute;
            bottom: 80px;
            right: 20px;
            color: rgba(0, 243, 255, 0.08);
            font-family: 'Courier New', monospace;
            font-size: 8px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: right;
            z-index: 10;
            line-height: 1.8;
        }

        .grave-info {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            color: rgba(255, 200, 100, 0.6);
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 100, 0.1);
        }
        .grave-info.visible {
            opacity: 1;
        }
        .grave-info .name {
            color: #ffdd88;
            font-size: 14px;
        }
        .grave-info .dates {
            color: rgba(255, 200, 100, 0.4);
            font-size: 9px;
        }
        .grave-info .location {
            color: rgba(255, 200, 100, 0.2);
            font-size: 7px;
            margin-top: 2px;
        }

        .controls-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            color: rgba(0, 243, 255, 0.08);
            font-family: 'Courier New', monospace;
            font-size: 8px;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
            opacity: 0.5;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 16px;
            border-radius: 20px;
        }
        .controls-hint .key {
            color: #ff8844;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            opacity: 0.3;
            color: #00f3ff;
            font-size: 20px;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            .controls-hint {
                display: none;
            }
            #controls button {
                font-size: 6px;
                padding: 3px 7px;
            }
            .ui-hud {
                font-size: 8px;
                top: 10px;
                left: 10px;
            }
            #status {
                font-size: 7px;
                bottom: 70px;
            }
            .grave-info {
                font-size: 8px;
                padding: 6px 14px;
                bottom: 75px;
            }
            .grave-info .name {
                font-size: 11px;
            }
            #crosshair {
                font-size: 14px;
                opacity: 0.2;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
</head>
<body>

    <div class="ui-hud">
        [SYSTEM]: FPS_MEMORIAL_PARK<br>
        <span class="highlight">[GROUND]: CEMETERY</span><br>
        <span class="sky">[SKY]: GALAXY_MEMORIALS</span><br>
        <span class="key">[FPS]: CLICK TO LOCK MOUSE</span>
    </div>

    <div id="crosshair">+</div>

    <div class="grave-info" id="graveInfo">
        <div class="name" id="graveName">ИМЯ</div>
        <div class="dates" id="graveDates">📅 1945 — 2023</div>
        <div class="location" id="graveLocation">✦ ЗЕМЛЯ ✦</div>
    </div>

    <div class="controls-hint">
        <span class="key">W A S D</span> — движение · <span class="key">Q</span> ↑ · <span class="key">E</span> ↓ · <span class="key">Shift</span> — бег · <span class="key">Scroll</span> — лететь
    </div>

    <div id="status">
        <span id="fpsDisplay">60 FPS</span><br>
        <span id="particleCount">particles</span>
    </div>

    <div id="controls">
        <button id="btnReset">⟲</button>
        <button id="btnCandles" class="gold active">🕯️</button>
        <button id="btnGalaxy" class="gold active">🌌</button>
        <button id="btnFog" class="active">🌫️</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // =========================================
        // 1. СЦЕНА
        // =========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050e, 0.008);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 40);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.setClearColor(0x05050e);
        container.appendChild(renderer.domElement);

        // =========================================
        // 2. ОСВЕЩЕНИЕ
        // =========================================
        const ambientLight = new THREE.AmbientLight(0x1a1a3a, 1.2);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x00f3ff, 1.5);
        moonLight.position.set(30, 80, 40);
        moonLight.castShadow = true;
        scene.add(moonLight);

        // =========================================
        // 3. ЗЕМЛЯ
        // =========================================
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a14, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // =========================================
        // 4. ТЕКСТУРА ШУМА
        // =========================================
        function createNoiseTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            for (let x = 0; x < 128; x++) {
                for (let y = 0; y < 128; y++) {
                    const val = Math.floor(Math.random() * 255);
                    ctx.fillStyle = `rgb(${val},${val},${val})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }
        const noiseTex = createNoiseTexture();

        function makeTexture(char, color = '#ffffff', size = 32) {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const ctx = c.getContext('2d');
            ctx.fillStyle = color;
            ctx.font = `Bold ${size}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.fillText(char, 32, 32);
            return new THREE.CanvasTexture(c);
        }

        // =========================================
        // 5. КОНСТРУКТОР ПАМЯТНИКОВ (КЛАДБИЩЕ)
        // =========================================
        const graniteMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.3, metalness: 0.8 });
        const candleLightMat = new THREE.MeshBasicMaterial({ color: 0xffa500 });

        function addCandle(group, x, z) {
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.2, 10), graniteMat);
            base.position.set(x, 0.6, z);
            const flame = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), candleLightMat);
            flame.position.set(x, 1.5, z);
            const light = new THREE.PointLight(0xffaa00, 1.5, 10);
            light.position.set(x, 1.8, z);
            group.add(base, flame, light);
        }

        function createClassicTomb(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            const base = new THREE.Mesh(new THREE.BoxGeometry(8, 1.2, 5), graniteMat);
            base.position.y = 0.6;
            base.castShadow = true;
            const stele = new THREE.Mesh(new THREE.BoxGeometry(6, 10, 1.2), graniteMat);
            stele.position.set(0, 6.2, -1.2);
            stele.castShadow = true;
            const photoFrame = new THREE.Mesh(
                new THREE.CylinderGeometry(1.2, 1.2, 0.15, 24),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 })
            );
            photoFrame.rotation.x = Math.PI / 2;
            photoFrame.position.set(0, 8, -0.5);
            group.add(base, stele, photoFrame);
            addCandle(group, 2.5, 1.2);
            scene.add(group);
            group.userData = { name: 'Классический памятник', dates: '—', type: 'earth' };
            return group;
        }

        function createCrossTomb(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            const base = new THREE.Mesh(new THREE.BoxGeometry(6, 1.5, 4), graniteMat);
            base.position.y = 0.75;
            const vBar = new THREE.Mesh(new THREE.BoxGeometry(1.5, 11, 1), graniteMat);
            vBar.position.set(0, 7, 0);
            const hBar = new THREE.Mesh(new THREE.BoxGeometry(6, 1.5, 1), graniteMat);
            hBar.position.set(0, 9, 0);
            group.add(base, vBar, hBar);
            addCandle(group, -2, 1);
            scene.add(group);
            group.userData = { name: 'Крест', dates: '—', type: 'earth' };
            return group;
        }

        function createDoubleTomb(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            const base = new THREE.Mesh(new THREE.BoxGeometry(14, 1.2, 5), graniteMat);
            base.position.y = 0.6;
            const stele = new THREE.Mesh(new THREE.BoxGeometry(12, 7, 1.2), graniteMat);
            stele.position.set(0, 4.7, -1.2);
            const frame1 = new THREE.Mesh(
                new THREE.CylinderGeometry(1.1, 1.1, 0.15, 24),
                new THREE.MeshStandardMaterial({ color: 0xdddddd })
            );
            frame1.rotation.x = Math.PI / 2;
            frame1.position.set(-3, 5.5, -0.5);
            const frame2 = frame1.clone();
            frame2.position.set(3, 5.5, -0.5);
            group.add(base, stele, frame1, frame2);
            addCandle(group, 0, 1.5);
            scene.add(group);
            group.userData = { name: 'Семейный памятник', dates: '—', type: 'earth' };
            return group;
        }

        function createHoloTomb(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            const base = new THREE.Mesh(new THREE.BoxGeometry(7, 1.2, 4), graniteMat);
            base.position.y = 0.6;
            const holoGeo = new THREE.BoxGeometry(5, 9, 0.6);
            const holoMat = new THREE.MeshBasicMaterial({
                map: noiseTex,
                color: 0x00f3ff,
                transparent: true,
                opacity: 0.5,
            });
            const holoStele = new THREE.Mesh(holoGeo, holoMat);
            holoStele.position.set(0, 5.5, 0);
            group.add(base, holoStele);
            scene.add(group);
            group.userData = { name: 'Голографический памятник', dates: '—', type: 'earth' };
            return group;
        }

        function createMemoryWall(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            const wall = new THREE.Mesh(new THREE.BoxGeometry(30, 12, 1.5), graniteMat);
            wall.position.y = 6;
            for (let i = -12; i <= 12; i += 6) {
                const frame = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 4, 0.3),
                    new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.2, metalness: 0.5 })
                );
                frame.position.set(i, 6, 1.0);
                group.add(frame);
            }
            group.add(wall);
            scene.add(group);
            group.userData = { name: 'Стена памяти', dates: '—', type: 'earth' };
            return group;
        }

        // РАССАЖИВАЕМ КЛАДБИЩЕ
        const earthGroups = [];
        const g1 = createClassicTomb(-20, 10);
        const g2 = createCrossTomb(0, 10);
        const g3 = createDoubleTomb(20, 10);
        const g4 = createHoloTomb(-10, -15);
        const g5 = createHoloTomb(10, -15);
        const g6 = createMemoryWall(0, -35);
        earthGroups.push(g1, g2, g3, g4, g5, g6);

        // =========================================
        // 6. ГАЛАКТИКА (ВВЕРХУ)
        // =========================================
        const galaxyData = [{
            id: 0,
            name: 'Андрей',
            dates: '1970 — 2020',
            x: -30,
            y: 120,
            z: -20,
            color: '#ffdd88'
        }, {
            id: 1,
            name: 'Людмила',
            dates: '1965 — 2019',
            x: -15,
            y: 130,
            z: 15,
            color: '#ff88aa'
        }, {
            id: 2,
            name: 'Григорий',
            dates: '1958 — 2021',
            x: 20,
            y: 125,
            z: -25,
            color: '#88ddff'
        }, {
            id: 3,
            name: 'Зоя',
            dates: '1943 — 2020',
            x: 35,
            y: 140,
            z: 10,
            color: '#ffaa88'
        }, {
            id: 4,
            name: 'Николай',
            dates: '1930 — 2018',
            x: -25,
            y: 115,
            z: 30,
            color: '#88ffaa'
        }, {
            id: 5,
            name: 'Татьяна',
            dates: '1940 — 2022',
            x: 25,
            y: 135,
            z: -35,
            color: '#aa88ff'
        }, {
            id: 6,
            name: 'Борис',
            dates: '1950 — 2023',
            x: 0,
            y: 150,
            z: 0,
            color: '#ffdd44'
        }, {
            id: 7,
            name: 'Елена',
            dates: '1945 — 2022',
            x: 0,
            y: 110,
            z: -40,
            color: '#ff88dd'
        }, ];

        const galaxyN = 15000;
        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyPos = new Float32Array(galaxyN * 3);
        const galaxyBase = new Float32Array(galaxyN * 3);
        const galaxyCol = new Float32Array(galaxyN * 3);
        const galaxyFlags = new Uint8Array(galaxyN);

        const colGalaxy = new THREE.Color(0x334466);
        const colGalaxyGold = new THREE.Color(0xffdd88);
        const colGalaxyFlame = new THREE.Color(0xff6633);

        let galaxyIdx = 0;

        function addGalaxyParticle(x, y, z, color, flag) {
            if (galaxyIdx >= galaxyN) return;
            galaxyPos[galaxyIdx * 3] = x;
            galaxyPos[galaxyIdx * 3 + 1] = y;
            galaxyPos[galaxyIdx * 3 + 2] = z;
            galaxyBase[galaxyIdx * 3] = x;
            galaxyBase[galaxyIdx * 3 + 1] = y;
            galaxyBase[galaxyIdx * 3 + 2] = z;
            galaxyCol[galaxyIdx * 3] = color.r;
            galaxyCol[galaxyIdx * 3 + 1] = color.g;
            galaxyCol[galaxyIdx * 3 + 2] = color.b;
            galaxyFlags[galaxyIdx] = flag;
            galaxyIdx++;
        }

        galaxyData.forEach((grave) => {
            const gx = grave.x;
            const gy = grave.y;
            const gz = grave.z;
            const color = new THREE.Color(grave.color);

            for (let i = 0; i < 200; i++) {
                const w = 3 + Math.random() * 3;
                const h = 4 + Math.random() * 4;
                const d = 1.2 + Math.random() * 1.5;
                const x = gx + (Math.random() - 0.5) * w;
                const z = gz + (Math.random() - 0.5) * d;
                const y = gy + (Math.random() - 0.5) * h + 0.5;
                const bright = 0.3 + Math.random() * 0.3;
                addGalaxyParticle(x, y, z, new THREE.Color(colGalaxy.r * bright, colGalaxy.g * bright, colGalaxy.b *
                    bright), 1);
            }

            for (let i = 0; i < 80; i++) {
                const x = gx + (Math.random() - 0.5) * 2.5;
                const z = gz + (Math.random() - 0.5) * 1.5;
                const y = gy + 2.5 + Math.random() * 3;
                const bright = 0.5 + Math.random() * 0.5;
                addGalaxyParticle(x, y, z, new THREE.Color(colGalaxyGold.r * bright, colGalaxyGold.g * bright,
                    colGalaxyGold.b * bright), 2);
            }

            const nameChars = grave.name.split('');
            for (let ci = 0; ci < nameChars.length; ci++) {
                for (let j = 0; j < 15; j++) {
                    const x = gx - nameChars.length * 0.7 + ci * 1.4 + (Math.random() - 0.5) * 0.5;
                    const z = gz + 2.5 + (Math.random() - 0.5) * 0.4;
                    const y = gy + 1.8 + Math.random() * 1;
                    const bright = 0.6 + Math.random() * 0.4;
                    addGalaxyParticle(x, y, z, new THREE.Color(color.r * bright, color.g * bright, color.b * bright), 3);
                }
            }

            for (let i = 0; i < 25; i++) {
                const a = Math.random() * Math.PI * 2;
                const r = 2 + Math.random() * 2.5;
                const x = gx + Math.cos(a) * r;
                const z = gz + Math.sin(a) * r;
                const y = gy - 0.5 + Math.random() * 0.5;
                const bright = 0.4 + Math.random() * 0.6;
                addGalaxyParticle(x, y, z, new THREE.Color(colGalaxyFlame.r * bright, colGalaxyFlame.g * bright * 0.6,
                    colGalaxyFlame.b * bright * 0.3), 4);
            }

            for (let i = 0; i < 25; i++) {
                const a = Math.random() * Math.PI * 2;
                const r = 3 + Math.random() * 6;
                const x = gx + Math.cos(a) * r;
                const z = gz + Math.sin(a) * r;
                const y = gy + (Math.random() - 0.5) * 5 + 2;
                const bright = 0.3 + Math.random() * 0.5;
                addGalaxyParticle(x, y, z, new THREE.Color(0.6 * bright, 0.8 * bright, 1 * bright), 5);
            }
        });

        for (let i = 0; i < 1500; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = 50 + Math.random() * 80;
            const x = Math.cos(a) * r;
            const z = Math.sin(a) * r;
            const y = 100 + Math.random() * 50;
            const bright = 0.03 + Math.random() * 0.06;
            addGalaxyParticle(x, y, z, new THREE.Color(0.03 * bright, 0.05 * bright, 0.1 * bright), 6);
        }

        const galaxyPosFinal = galaxyPos.slice(0, galaxyIdx * 3);
        const galaxyBaseFinal = galaxyBase.slice(0, galaxyIdx * 3);
        const galaxyColFinal = galaxyCol.slice(0, galaxyIdx * 3);
        const galaxyFlagsFinal = galaxyFlags.slice(0, galaxyIdx);

        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPosFinal, 3));
        galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColFinal, 3));

        const galaxyMat = new THREE.PointsMaterial({
            size: 2.0,
            map: makeTexture('✦', '#ffdd88', 32),
            transparent: true,
            opacity: 0.85,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });

        const galaxyCloud = new THREE.Points(galaxyGeo, galaxyMat);
        scene.add(galaxyCloud);

        // =========================================
        // 7. FPS-КАМЕРА
        // =========================================
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let pitch = 0,
            yaw = 0;
        let isPointerLocked = false;

        container.addEventListener('click', () => {
            if (!isPointerLocked) {
                container.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === container;
            container.style.cursor = isPointerLocked ? 'none' : 'grab';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            const sensitivity = 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-1.5, Math.min(1.5, pitch));
            euler.set(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        });

        // Колёсико — летим вперёд/назад
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 1 : -1;
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            camera.position.addScaledVector(dir, delta * 0.8);
            // Не даём уйти под землю
            if (camera.position.y < 0.5) camera.position.y = 0.5;
        }, { passive: false });

        // =========================================
        // 8. КЛАВИАТУРА
        // =========================================
        const keys = { w: false, a: false, s: false, d: false, q: false, e: false, shift: false };
        const moveSpeed = 0.6;

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
            if (key === 'q') keys.q = true;
            if (key === 'e') keys.e = true;
            if (key === 'shift') keys.shift = true;
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
            if (key === 'q') keys.q = false;
            if (key === 'e') keys.e = false;
            if (key === 'shift') keys.shift = false;
        });

        function updateKeyboard() {
            const speed = keys.shift ? moveSpeed * 2 : moveSpeed;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);

            const move = new THREE.Vector3();
            if (keys.w) move.add(forward.clone().multiplyScalar(speed));
            if (keys.s) move.add(forward.clone().multiplyScalar(-speed));
            if (keys.a) move.add(right.clone().multiplyScalar(-speed));
            if (keys.d) move.add(right.clone().multiplyScalar(speed));
            if (keys.q) move.y += speed * 0.8;
            if (keys.e) move.y -= speed * 0.8;

            if (move.length() > 0) {
                camera.position.add(move);
                if (camera.position.y < 0.5) camera.position.y = 0.5;
            }
        }

        // =========================================
        // 9. РАЙКАСТ ДЛЯ ХОВЕРА
        // =========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredGrave = null;
        const graveInfo = document.getElementById('graveInfo');
        const graveName = document.getElementById('graveName');
        const graveDates = document.getElementById('graveDates');
        const graveLocation = document.getElementById('graveLocation');

        const earthSpheres = [];
        earthGroups.forEach((g, idx) => {
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(5, 8, 8),
                new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
            );
            const pos = g.position;
            sphere.position.set(pos.x, 2, pos.z);
            sphere.userData = { type: 'earth', index: idx };
            scene.add(sphere);
            earthSpheres.push(sphere);
        });

        const galaxySpheres = [];
        galaxyData.forEach((g, idx) => {
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(6, 8, 8),
                new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
            );
            sphere.position.set(g.x, g.y + 2, g.z);
            sphere.userData = { type: 'galaxy', index: idx };
            scene.add(sphere);
            galaxySpheres.push(sphere);
        });

        const allSpheres = [...earthSpheres, ...galaxySpheres];

        container.addEventListener('mousemove', (e) => {
            if (isPointerLocked) {
                graveInfo.classList.remove('visible');
                return;
            }
            const rect = container.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(allSpheres);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                let g, loc;
                if (data.type === 'earth') {
                    g = earthGroups[data.index];
                    loc = '✦ ЗЕМЛЯ ✦';
                } else {
                    g = galaxyData[data.index];
                    loc = '✦ ГАЛАКТИКА ✦';
                }
                if (g && g.userData) {
                    graveName.textContent = g.userData.name || 'Имя';
                    graveDates.textContent = g.userData.dates || '📅 —';
                    graveLocation.textContent = loc;
                    graveInfo.classList.add('visible');
                    container.style.cursor = 'pointer';
                }
            } else {
                graveInfo.classList.remove('visible');
                container.style.cursor = 'grab';
            }
        });

        // =========================================
        // 10. КНОПКИ
        // =========================================
        let candlesOn = true,
            galaxyOn = true,
            fogOn = true;

        document.getElementById('btnReset').addEventListener('click', () => {
            camera.position.set(0, 5, 40);
            pitch = 0;
            yaw = 0;
            euler.set(0, 0, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        });

        document.getElementById('btnCandles').addEventListener('click', function() {
            candlesOn = !candlesOn;
            this.classList.toggle('active');
            this.textContent = candlesOn ? '🕯️' : '🕯️OFF';
            earthGroups.forEach((group) => {
                group.children.forEach((child) => {
                    if (child.isPointLight) {
                        child.intensity = candlesOn ? 1.5 : 0;
                    }
                    if (child.type === 'Mesh' && child.material === candleLightMat) {
                        child.visible = candlesOn;
                    }
                });
            });
        });

        document.getElementById('btnGalaxy').addEventListener('click', function() {
            galaxyOn = !galaxyOn;
            this.classList.toggle('active');
            this.textContent = galaxyOn ? '🌌' : '🌌OFF';
            galaxyCloud.visible = galaxyOn;
        });

        document.getElementById('btnFog').addEventListener('click', function() {
            fogOn = !fogOn;
            this.classList.toggle('active');
            this.textContent = fogOn ? '🌫️' : '🌫️OFF';
            scene.fog.density = fogOn ? 0.008 : 0.0001;
        });

        // ---- ЗАПРЕТ МЕНЮ ----
        container.addEventListener('contextmenu', (e) => e.preventDefault());

        // =========================================
        // 11. TOUCH (ТЕЛЕФОН)
        // =========================================
        let touch1 = null,
            touch2 = null;
        let touchStartDist = 0;
        let touchStartYaw = 0,
            touchStartPitch = 0;
        let touchStartPos = new THREE.Vector3();
        let isTouching = false;
        let lastTouchX = 0,
            lastTouchY = 0;

        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 1) {
                touch1 = touches[0];
                lastTouchX = touch1.clientX;
                lastTouchY = touch1.clientY;
                isTouching = true;
                touchStartYaw = yaw;
                touchStartPitch = pitch;
                touchStartPos.copy(camera.position);
            } else if (touches.length === 2) {
                touch1 = touches[0];
                touch2 = touches[1];
                const dx = touch2.clientX - touch1.clientX;
                const dy = touch2.clientY - touch1.clientY;
                touchStartDist = Math.sqrt(dx * dx + dy * dy);
                touchStartPos.copy(camera.position);
                touchStartYaw = yaw;
                touchStartPitch = pitch;
                isTouching = true;
            }
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touches = e.touches;

            if (touches.length === 1 && isTouching) {
                const t = touches[0];
                const dx = t.clientX - lastTouchX;
                const dy = t.clientY - lastTouchY;
                yaw -= dx * 0.005;
                pitch -= dy * 0.005;
                pitch = Math.max(-1.5, Math.min(1.5, pitch));
                euler.set(pitch, yaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);
                lastTouchX = t.clientX;
                lastTouchY = t.clientY;
            } else if (touches.length === 2 && isTouching) {
                const t1 = touches[0];
                const t2 = touches[1];
                const dx = t2.clientX - t1.clientX;
                const dy = t2.clientY - t1.clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const scale = dist / touchStartDist;
                const speed = 0.5;

                // Зум
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const deltaZ = (1 - scale) * 20;
                camera.position.addScaledVector(dir, deltaZ);

                // Панорамирование
                const midX = (t1.clientX + t2.clientX) / 2;
                const midY = (t1.clientY + t2.clientY) / 2;
                const startMidX = (touch1.clientX + touch2.clientX) / 2;
                const startMidY = (touch1.clientY + touch2.clientY) / 2;
                const panX = (midX - startMidX) * 0.3;
                const panY = (midY - startMidY) * 0.3;

                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                right.y = 0;
                right.normalize();

                camera.position.addScaledVector(right, -panX);
                camera.position.addScaledVector(forward, panY);

                if (camera.position.y < 0.5) camera.position.y = 0.5;
            }
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            isTouching = false;
            touch1 = null;
            touch2 = null;
        }, { passive: false });

        // =========================================
        // 12. FPS
        // =========================================
        let fc = 0,
            lastFps = performance.now();
        const fpsEl = document.getElementById('fpsDisplay');

        function updateFps() {
            fc++;
            const now = performance.now();
            if (now - lastFps >= 1000) {
                fpsEl.textContent = Math.round(fc * 1000 / (now - lastFps)) + ' FPS';
                fc = 0;
                lastFps = now;
            }
        }

        // =========================================
        // 13. АНИМАЦИЯ
        // =========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();

            // Свечи мерцают
            if (candlesOn) {
                earthGroups.forEach((group) => {
                    group.children.forEach((child) => {
                        if (child.isPointLight) {
                            const flicker = 0.7 + Math.sin(t * 5 + child.id * 0.5) * 0.3;
                            child.intensity = flicker * 1.5;
                        }
                    });
                });
            }

            // Дыхание галактик
            const gp = galaxyGeo.attributes.position;
            for (let i = 0; i < galaxyIdx; i++) {
                if (galaxyFlagsFinal[i] === 1 || galaxyFlagsFinal[i] === 2 || galaxyFlagsFinal[i] === 3) {
                    const bx = galaxyBaseFinal[i * 3],
                        by = galaxyBaseFinal[i * 3 + 1],
                        bz = galaxyBaseFinal[i * 3 + 2];
                    const wave = Math.sin(t * 0.3 + bx * 0.03 + bz * 0.03) * 0.3;
                    gp.setXYZ(i, bx, by + wave, bz);
                }
            }
            gp.needsUpdate = true;

            // Клавиатура
            updateKeyboard();

            updateFps();
            renderer.render(scene, camera);
        }

        // =========================================
        // 14. РЕСАЙЗ
        // =========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =========================================
        // 15. СТАРТ
        // =========================================
        animate();

        console.log('🪦 Memorial Park — FPS Controls!');
        console.log('🖱️ Click → lock mouse for free look');
        console.log('⌨️ WASD — move | Q/E — up/down | Shift — sprint');
        console.log('🖱️ Scroll — fly forward/backward');
        console.log('📱 Touch — one finger rotate, two fingers zoom/pan');
        console.log('✨ Hover over graves or galaxies to see names!');
    </script>
</body>
</html>
