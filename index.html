<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Memorial Touch & PC Responsive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* Отключаем стандартный скролл браузера на смартфонах, чтобы пальцы управляли 3D */
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020208;
      font-family: monospace;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    .ui-hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #00f3ff;
      font-size: 10px;
      letter-spacing: 1.5px;
      pointer-events: none;
      text-transform: uppercase;
      opacity: 0.85;
      line-height: 1.5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="ui-hud">
    [SYSTEM]: TOUCH_NAVIGATION_ACTIVE<br>
    [MOBILE]: 1 FINGER=ROTATE | 2 FINGERS=ZOOM/PAN<br>
    [PC]: MOUSE DRAG & WHEEL
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // НАСТРОЙКА УПРАВЛЕНИЯ СЕНСОРОМ И МЫШЬЮ
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;      // Плавная инерция
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.8;
    controls.maxPolarAngle = Math.PI / 2 - 0.01; // Камера не проваливается под землю

    // Свет и Ландшафт
    const ambientLight = new THREE.AmbientLight(0x1a1a3a, 1.5);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x00f3ff, 1.5);
    moonLight.position.set(30, 80, 40);
    scene.add(moonLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshStandardMaterial({ color: 0x080810, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Материал гранита
    const graniteMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.3, metalness: 0.8 });

    // Простая функция генерации памятников
    function addMemorial(x, z, type) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const base = new THREE.Mesh(new THREE.BoxGeometry(8, 1.5, 5), graniteMat);
      base.position.y = 0.75;
      group.add(base);

      if (type === 'stele') {
        const stele = new THREE.Mesh(new THREE.BoxGeometry(6, 11, 1.2), graniteMat);
        stele.position.set(0, 7, 0);
        group.add(stele);
      } else if (type === 'cross') {
        const vBar = new THREE.Mesh(new THREE.BoxGeometry(1.5, 12, 1), graniteMat);
        vBar.position.set(0, 7.5, 0);
        const hBar = new THREE.Mesh(new THREE.BoxGeometry(7, 1.5, 1), graniteMat);
        hBar.position.set(0, 9.5, 0);
        group.add(vBar, hBar);
      }

      scene.add(group);
    }

    addMemorial(-15, 0, 'stele');
    addMemorial(15, 0, 'cross');

    // Адаптив под разворот мобильника или изменение экрана ПК
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Анимационный цикл
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // Обязательно обновляем контроллер каждый кадр для плавности!
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
