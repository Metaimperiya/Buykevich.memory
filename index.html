<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Memorial Park — 3D Cemetery + Galaxy</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

<body>

    <!-- UI -->
    <div class="ui-hud">
        [SYSTEM]: MEMORIAL_PARK<br>
        <span class="highlight">[GROUND]: CEMETERY</span><br>
        <span class="sky">[SKY]: GALAXY_MEMORIALS</span><br>
        <span class="key">[FPS]: CLICK TO LOCK MOUSE</span>
    </div>

    <div id="crosshair">+</div>

    <div class="grave-info" id="graveInfo">
        <div class="name" id="graveName">ИМЯ</div>
        <div class="dates" id="graveDates">📅 1945 — 2023</div>
        <div class="location" id="graveLocation">✦ ЗЕМЛЯ ✦</div>
    </div>

    <div class="controls-hint">
        <span class="key">W A S D</span> — движение · <span class="key">Q</span> ↑ · <span class="key">E</span> ↓ · <span class="key">Shift</span> — бег · <span class="key">Scroll</span> — лететь
    </div>

    <div id="status">
        <span id="fpsDisplay">60 FPS</span><br>
        <span id="particleCount">particles</span>
    </div>

    <div id="controls">
        <button id="btnReset">⟲</button>
        <button id="btnCandles" class="gold active">🕯️</button>
        <button id="btnGalaxy" class="gold active">🌌</button>
        <button id="btnFog" class="active">🌫️</button>
    </div>

    <div id="canvas-container"></div>
