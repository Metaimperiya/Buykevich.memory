<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelos City — Некрополь и Галактика</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>

    <div id="controls-info" class="hud-panel">
        <h3>Управление</h3>
        <b>Клик</b> — Обзор мышью<br>
        <b>WASD</b> — Движение<br>
        <b>E / Q</b> — Взлёт в Галактику / Спуск<br>
        <b>Shift</b> — Ускорение
    </div>

    <div id="graveInfo" class="hud-panel">
        <div id="graveName">—</div>
        <div id="graveDates">—</div>
        <div id="graveLocation">—</div>
    </div>

    <div id="webgl-container"></div>

    <!-- Подключаем скрипты в строго правильном порядке -->
    <script src="js/core/scene.js"></script>
    <script src="js/cemetery/tombs.js"></script>
    <script src="js/galaxy/galaxy-system.js"></script>
    <script src="js/controls/keyboard.js"></script>
    <script src="js/controls/fps-camera.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
